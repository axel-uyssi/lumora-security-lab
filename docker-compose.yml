services:

  # ─────────────────────────────────────────────
  # POSTGRESQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine

    container_name: lumora-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: lumora_db
      POSTGRES_USER: lumora
      POSTGRES_PASSWORD: lumora_pass_2025

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - lumora-internal

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumora -d lumora_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # REDIS
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine

    container_name: lumora-redis

    restart: unless-stopped

    command: >
      redis-server
      --requirepass redis_pass_2025
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - lumora-internal

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_pass_2025", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # PGADMIN
  # ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest

    container_name: lumora-pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lumora.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "127.0.0.1:5050:80"

    networks:
      - lumora-internal

    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # FRONTEND
  # ─────────────────────────────────────────────
  frontend:
    image: nginx:alpine

    container_name: lumora-frontend

    restart: unless-stopped

    ports:
      - "8081:80"

    volumes:
      - ./frontend/html:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    networks:
      - lumora-internal

# ─────────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:

# ─────────────────────────────────────────────
# NETWORKS
# ─────────────────────────────────────────────
networks:
  lumora-internal:
    driver: bridge