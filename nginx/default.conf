server {
    listen 80;
    server_name _;

    # ── Raiz do frontend ──────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ── Compressão gzip ───────────────────────────────────────────────────────
    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    # ── Headers de segurança ──────────────────────────────────────────────────
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self' https://images.unsplash.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';";

    # ── Rota principal ────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy para a API Spring Boot ──────────────────────────────────────────
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # ── Bloqueia arquivos ocultos ─────────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/lumora-access.log;
    error_log  /var/log/nginx/lumora-error.log warn;
}