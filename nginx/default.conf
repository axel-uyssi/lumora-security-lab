server {
    listen 80;
    server_name _;

    # ─────────────────────────────────────────
    # FRONTEND
    # ─────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ─────────────────────────────────────────
    # GZIP / PERFORMANCE
    # ─────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ─────────────────────────────────────────
    # SECURITY HEADERS
    # ─────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP
    add_header Content-Security-Policy "
        default-src 'self';
        img-src 'self' https://images.unsplash.com data:;
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        font-src 'self' data:;
        connect-src 'self';
        frame-ancestors 'none';
    " always;

    # Remove informações do servidor
    server_tokens off;

    # ─────────────────────────────────────────
    # CACHE DE ASSETS
    # ─────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {

        expires 30d;

        add_header Cache-Control "public, immutable";

        access_log off;

        try_files $uri =404;
    }

    # ─────────────────────────────────────────
    # SPA ROUTING
    # React / Vue / Angular
    # ─────────────────────────────────────────
    location / {

        try_files $uri $uri/ /index.html;
    }

    # ─────────────────────────────────────────
    # API SPRING BOOT
    # ─────────────────────────────────────────
    location /api/ {

        proxy_pass http://host.docker.internal:9999;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Remove headers do backend
        proxy_hide_header X-Powered-By;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;
    }

    # ─────────────────────────────────────────
    # HEALTHCHECK
    # ─────────────────────────────────────────
    location /health {

        access_log off;

        return 200 'OK';

        add_header Content-Type text/plain;
    }

    # ─────────────────────────────────────────
    # BLOQUEIA ARQUIVOS OCULTOS
    # ─────────────────────────────────────────
    location ~ /\. {

        deny all;

        access_log off;

        log_not_found off;
    }

    # ─────────────────────────────────────────
    # LOGS
    # ─────────────────────────────────────────
    access_log /var/log/nginx/lumora-access.log;
    error_log  /var/log/nginx/lumora-error.log warn;
}