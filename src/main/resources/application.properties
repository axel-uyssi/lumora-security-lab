# ─────────────────────────────────────────
# SERVER
# ─────────────────────────────────────────
server.port=9999

# ─────────────────────────────────────────
# POSTGRESQL
# ─────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/lumora_db
spring.datasource.username=lumora
spring.datasource.password=lumora_pass_2025
spring.datasource.driver-class-name=org.postgresql.Driver

# ─────────────────────────────────────────
# JPA / HIBERNATE
# ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─────────────────────────────────────────
# FLYWAY
# ─────────────────────────────────────────
# Desativado temporariamente durante setup inicial
spring.flyway.enabled=false

# ─────────────────────────────────────────
# REDIS
# ─────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ─────────────────────────────────────────
# JWT
# ─────────────────────────────────────────
lumora.jwt.secret=8f4e2c9d7a1b6e5f3d9c8a7b2f1e6d4c5b9a8e7f6c3d2a1

# 1 hora
lumora.jwt.expiration-ms=3600000

# ─────────────────────────────────────────
# LOGGING
# ─────────────────────────────────────────
logging.level.org.springframework.security=DEBUG
logging.level.com.lumora=DEBUG

# Mostrar queries SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE