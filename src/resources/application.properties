# =========================================================
# LUMORA API — APPLICATION.PROPERTIES
# Spring Boot 3 + Security + JWT + H2
# =========================================================

spring.application.name=lumora-api

# =========================================================
# SERVER
# =========================================================

server.port=8081
server.servlet.context-path=/api

# =========================================================
# H2 DATABASE
# =========================================================

spring.datasource.url=jdbc:h2:mem:lumora
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =========================================================
# H2 CONSOLE
# =========================================================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# =========================================================
# PERFORMANCE
# =========================================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# =========================================================
# JWT
# =========================================================

lumora.jwt.secret=NzE4YzE2ODc0NTEyYzYxNmU5ZDJmNjEzOTQxM2QxYjhjNjQ0OWE5NzI5N2U0OGE2NzQ1Nzg2YjA1OTI4Mg==

lumora.jwt.expiration-ms=3600000

# =========================================================
# JACKSON
# =========================================================

spring.jackson.default-property-inclusion=non_null

spring.jackson.serialization.write-dates-as-timestamps=false

# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO

logging.level.com.lumora=DEBUG

logging.level.org.springframework.security=DEBUG

logging.level.org.hibernate.SQL=DEBUG

logging.level.org.hibernate.orm.jdbc.bind=TRACE

# =========================================================
# ERROR HANDLING
# =========================================================

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# =========================================================
# UTF-8
# =========================================================

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =========================================================
# ACTUATOR (futuro monitoramento)
# =========================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=always